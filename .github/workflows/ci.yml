# CI gate:
#   - shellcheck over all shell scripts (scripts/ + the add-on's run.sh)
#   - gitleaks over the complete history (secret scan)
#   - trivy: Dockerfile configuration scan (misconfigurations)
#
# All actions are pinned to commit SHAs of their release tags
# (supply-chain protection: mutable tags can be overwritten).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: shellcheck
        run: shellcheck scripts/*.sh mosquitto-standalone/run.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # gitleaks scans the complete history
      - uses: gitleaks/gitleaks-action@1938557f6a58837331b99822ab17b8e536e7bef9  # v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: trivy config scan (Dockerfile misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: mosquitto-standalone/
          exit-code: '1'
          severity: HIGH,CRITICAL
          # DS-0002 (non-root USER) is a deliberate exception — rationale
          # in .trivyignore and the run.sh header.
          trivyignores: .trivyignore

  # CVE scan of the built image. Gate deliberately on CRITICAL only: the
  # digest pin freezes the CVE baseline; newly discovered CRITICALs turn
  # CI red and force a DELIBERATE base-image bump — HIGH findings in
  # Alpine packages would just cause constant flakiness.
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: build add-on image
        run: docker build -t mosquitto-standalone:ci mosquitto-standalone/
      - name: trivy CVE scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: mosquitto-standalone:ci
          exit-code: '1'
          severity: CRITICAL
          trivyignores: .trivyignore
